<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Todo Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Smart Todo Manager</span>
        <button class="btn btn-light btn-sm" id="addTaskBtn" type="button">+ Add Task</button>
    </div>
</nav>

<main class="container py-4">

    <!-- Dashboard -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card stat-card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small">Total</div>
                    <div class="stat-number" id="statTotal">0</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small">Pending</div>
                    <div class="stat-number text-secondary" id="statPending">0</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small">Ongoing</div>
                    <div class="stat-number text-warning" id="statOngoing">0</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small">Completed</div>
                    <div class="stat-number text-success" id="statCompleted">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Search and filters -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
            <div class="row g-2">
                <div class="col-12 col-md-5">
                    <input type="search" class="form-control" id="searchInput" placeholder="Search by title...">
                </div>
                <div class="col-6 col-md-3">
                    <select class="form-select" id="filterStatus">
                        <option value="">All statuses</option>
                        <option value="TODO">To Do</option>
                        <option value="ONGOING">Ongoing</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <select class="form-select" id="filterPriority">
                        <option value="">All priorities</option>
                        <option value="HIGH">High</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="LOW">Low</option>
                    </select>
                </div>
                <div class="col-12 col-md-1 d-grid">
                    <button class="btn btn-outline-secondary" id="clearFiltersBtn" type="button">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Task table -->
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Task</th>
                    <th>Priority</th>
                    <th>Due date</th>
                    <th style="min-width: 150px;">Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="taskTableBody"></tbody>
            </table>
        </div>
        <div class="text-center text-muted py-5 d-none" id="emptyState">
            No tasks found. Click "+ Add Task" to create one.
        </div>
    </div>
</main>

<!-- Add / Edit modal -->
<div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="taskForm" novalidate>
            <div class="modal-header">
                <h5 class="modal-title" id="taskModalTitle">Add Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-danger d-none" id="formError"></div>
                <input type="hidden" id="taskId">

                <div class="mb-3">
                    <label for="taskTitle" class="form-label">Title *</label>
                    <input type="text" class="form-control" id="taskTitle" maxlength="100">
                    <div class="invalid-feedback" id="taskTitleError"></div>
                </div>

                <div class="mb-3">
                    <label for="taskDescription" class="form-label">Description</label>
                    <textarea class="form-control" id="taskDescription" rows="3" maxlength="1000"></textarea>
                    <div class="invalid-feedback" id="taskDescriptionError"></div>
                </div>

                <div class="row g-3">
                    <div class="col-12 col-sm-4">
                        <label for="taskPriority" class="form-label">Priority</label>
                        <select class="form-select" id="taskPriority">
                            <option value="LOW">Low</option>
                            <option value="MEDIUM" selected>Medium</option>
                            <option value="HIGH">High</option>
                        </select>
                    </div>
                    <div class="col-12 col-sm-4">
                        <label for="taskStatus" class="form-label">Status</label>
                        <select class="form-select" id="taskStatus">
                            <option value="TODO" selected>To Do</option>
                            <option value="ONGOING">Ongoing</option>
                            <option value="COMPLETED">Completed</option>
                        </select>
                    </div>
                    <div class="col-12 col-sm-4">
                        <label for="taskDueDate" class="form-label">Due date</label>
                        <input type="date" class="form-control" id="taskDueDate">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" id="saveTaskBtn">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete confirmation modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete task?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0">This will permanently delete <strong id="deleteTaskName"></strong>.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast messages -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
